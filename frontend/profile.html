<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile - Smart Interview Analyzer</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <div class="logo" onclick="window.location.href='index.html'" style="cursor: pointer;">
            <div class="logo-icon"></div>
            <span>SmartInterview</span>
        </div>
        <nav id="main-nav">
            <!-- Populated by auth.js -->
        </nav>
    </header>

    <main>
        <div class="glass-container profile-card">
            <div class="profile-avatar-row">
                <div class="profile-avatar" id="profile-initials">C</div>
                <div class="profile-meta">
                    <h3 id="profile-name">Candidate Name</h3>
                    <p id="profile-email">candidate@example.com</p>
                </div>
            </div>
            
            <div class="panel-header">
                <h3>Account Summary</h3>
            </div>
            
            <div style="display: flex; flex-direction: column; gap: 15px; margin-bottom: 30px;">
                <div style="display: flex; justify-content: space-between; padding-bottom: 12px; border-bottom: 1px solid var(--border-color);">
                    <span style="color: var(--text-secondary); font-weight: 500;">Average Evaluation Score</span>
                    <span style="font-weight: 700; color: var(--primary-color);" id="profile-avg-score">--</span>
                </div>
                <div style="display: flex; justify-content: space-between; padding-bottom: 12px; border-bottom: 1px solid var(--border-color);">
                    <span style="color: var(--text-secondary); font-weight: 500;">Practice Sessions Finished</span>
                    <span style="font-weight: 700;" id="profile-sessions-count">--</span>
                </div>
                <div style="display: flex; justify-content: space-between; padding-bottom: 12px; border-bottom: 1px solid var(--border-color);">
                    <span style="color: var(--text-secondary); font-weight: 500;">Primary Target Role</span>
                    <span style="font-weight: 700; color: var(--success-color);">Software Engineer</span>
                </div>
            </div>

            <button onclick="logout()" class="btn-secondary" style="width: 100%; justify-content: center;">Sign Out of Account</button>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 AI Smart Interview Analyzer. All rights reserved.</p>
    </footer>

    <!-- Scripts -->
    <script src="js/auth.js"></script>
    <script>
        // Check authentication
        checkAuth();
        
        document.addEventListener("DOMContentLoaded", () => {
            const user = getCurrentUser();
            if (user) {
                document.getElementById("profile-name").innerText = user.name;
                document.getElementById("profile-email").innerText = user.email;
                document.getElementById("profile-initials").innerText = user.name.charAt(0).toUpperCase();
                
                // Fetch stats from backend
                fetch(`${API_BASE_URL}/dashboard/stats/${user.id}`)
                    .then(res => res.json())
                    .then(data => {
                        if (data && data.total_interviews !== undefined) {
                            document.getElementById("profile-avg-score").innerText = `${data.average_score}%`;
                            document.getElementById("profile-sessions-count").innerText = data.total_interviews;
                        }
                    })
                    .catch(err => {
                        console.error("Profile Stats fetch error:", err);
                    });
            }
        });
    </script>
</body>
</html>
